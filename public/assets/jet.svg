<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 52" width="120" height="52">
  <defs>
    <linearGradient id="fuselageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a3b"/>
      <stop offset="55%" stop-color="#d61024"/>
      <stop offset="100%" stop-color="#990412"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#b70e1e"/>
    </linearGradient>
    <linearGradient id="canopyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#70a1ff"/>
      <stop offset="40%" stop-color="#2f3542"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>
    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2f3542"/>
      <stop offset="100%" stop-color="#57606f"/>
    </linearGradient>
    <filter id="jetGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Far Wing (Background) -->
  <polygon points="52,18 78,4 88,4 68,22" fill="#880814"/>

  <!-- Fuselage Body -->
  <path d="M 116,30 
           C 114,24 100,18 84,18 
           C 68,18 40,24 22,28 
           C 16,29 10,28 6,29 
           C 5,30 6,32 10,33 
           C 20,35 34,35 50,35 
           C 74,35 106,34 116,30 Z" 
        fill="url(#fuselageGrad)" 
        filter="url(#jetGlow)"/>

  <!-- Vertical Tailfin -->
  <path d="M 12,29 L 20,7 C 22,5 25,6 25,9 L 28,28 Z" fill="url(#fuselageGrad)"/>
  <path d="M 21,7 L 24,7 L 27,27 L 24,27 Z" fill="#ffffff" opacity="0.85"/>

  <!-- Horizontal Stabilizer -->
  <polygon points="6,29 20,29 24,33 10,33" fill="#a80b18"/>

  <!-- Cockpit Canopy -->
  <path d="M 72,21 C 76,14 88,14 96,21 C 94,22 74,22 72,21 Z" fill="url(#canopyGrad)"/>
  <path d="M 75,20 C 78,16 86,16 93,20" stroke="#ffffff" stroke-width="0.9" fill="none" opacity="0.75"/>

  <!-- Near Wing (Foreground) -->
  <path d="M 44,32 L 68,48 C 70,49 74,48 76,46 L 78,33 Z" fill="url(#wingGrad)" filter="url(#jetGlow)"/>
  <polygon points="68,48 76,46 75,44 67,46" fill="#ffffff" opacity="0.9"/>

  <!-- Racing Stripe -->
  <path d="M 30,30 L 102,27 C 100,28 88,31 70,32 Z" fill="#ffffff" opacity="0.92"/>

  <!-- Engine Exhaust at Anchor Point (38.4, 34.3) -->
  <ellipse cx="38" cy="34" rx="4.5" ry="3.5" fill="url(#engineGrad)"/>
  <ellipse cx="37" cy="34" rx="2" ry="2" fill="#ff7675"/>
  <ellipse cx="36" cy="34" rx="1" ry="1" fill="#ffeaa7"/>

  <!-- Propeller / Nose Cone -->
  <circle cx="116" cy="30" r="2.5" fill="#2f3542"/>
  <ellipse cx="117.5" cy="30" rx="1" ry="5.5" fill="#dfe4ea" opacity="0.75"/>
</svg>
