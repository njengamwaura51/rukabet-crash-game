<!DOCTYPE html>
<html>
<head><title>Check App</title></head>
<body>
<h1>Testing RukaBet App Load</h1>
<div id="status">Checking...</div>
<script>
  fetch('http://localhost:5175')
    .then(r => r.text())
    .then(html => {
      if (html.includes('RukaBet')) {
        document.getElementById('status').innerHTML = '✅ Server OK - RukaBet found';
      } else {
        document.getElementById('status').innerHTML = '⚠️ Server OK but no RukaBet';
      }
    })
    .catch(e => {
      document.getElementById('status').innerHTML = '❌ Server error: ' + e.message;
    });
</script>
</body>
</html>
